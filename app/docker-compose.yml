services:
  db:
    image: pgvector/pgvector:pg16
    container_name: af-db
    environment:
      POSTGRES_USER: af
      POSTGRES_PASSWORD: af
      POSTGRES_DB: agent_factory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U af"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
